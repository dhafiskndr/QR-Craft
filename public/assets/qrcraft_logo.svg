<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="qrCraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="120" height="120" rx="28" fill="url(#qrCraftGrad)" filter="url(#glow)"/>

  <!-- Top-Left Corner Box -->
  <rect x="22" y="22" width="30" height="30" rx="8" fill="white"/>
  <rect x="28" y="28" width="18" height="18" rx="4" fill="url(#qrCraftGrad)"/>
  <rect x="33" y="33" width="8" height="8" rx="2" fill="white"/>

  <!-- Top-Right Corner Box -->
  <rect x="68" y="22" width="30" height="30" rx="8" fill="white"/>
  <rect x="74" y="28" width="18" height="18" rx="4" fill="url(#qrCraftGrad)"/>
  <rect x="79" y="33" width="8" height="8" rx="2" fill="white"/>

  <!-- Bottom-Left Corner Box -->
  <rect x="22" y="68" width="30" height="30" rx="8" fill="white"/>
  <rect x="28" y="74" width="18" height="18" rx="4" fill="url(#qrCraftGrad)"/>
  <rect x="33" y="79" width="8" height="8" rx="2" fill="white"/>

  <!-- Center & Bottom Right Modern Elements -->
  <circle cx="63" cy="63" r="6" fill="url(#accentGrad)"/>
  <rect x="72" y="68" width="10" height="10" rx="3" fill="white"/>
  <rect x="88" y="68" width="10" height="10" rx="3" fill="url(#accentGrad)"/>
  <rect x="72" y="88" width="26" height="10" rx="3" fill="white"/>
  <circle cx="63" cy="80" r="4" fill="white"/>
  <circle cx="80" cy="81" r="3" fill="url(#accentGrad)"/>
</svg>
